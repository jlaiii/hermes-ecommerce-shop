<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGV ENGRAVELABS — Page Not Found</title>
    <style>
      body {
        margin: 0;
        background: #0b0f14;
        color: #e5e7eb;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .container { max-width: 480px; }
      .dog { width: 100%; border-radius: 16px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,.1); }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { color: #9ca3af; margin: 0 0 24px; }
      a {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 12px 20px; border-radius: 10px;
        background: linear-gradient(90deg, #22d3ee, #818cf8);
        color: #0b0f14; font-weight: 700; text-decoration: none;
      }
      .note { display: block; margin-top: 20px; color: #6b7280; font-size: 13px; }
    </style>
    <script>
      // SPA redirect for GitHub Pages
      const path = window.location.pathname;
      const base = '/hermes-ecommerce-shop/';
      if (path.startsWith(base)) {
        const route = path.slice(base.length);
        window.location.replace(base + '?' + (route ? 'p=' + encodeURIComponent(route) : ''));
      }
    </script>
  </head>
  <body>
    <div class="container">
      <noscript>
        <h1>Looks Like This Page Ran Away</h1>
        <p>Even our guard dog couldn't track it down. Let's head back to safety.</p>
        <a href="/hermes-ecommerce-shop/">Go Home</a>
      </noscript>
      <p class="note">If you're not redirected automatically, <a href="/hermes-ecommerce-shop/">go home</a>.</p>
    </div>
  </body>
</html>
